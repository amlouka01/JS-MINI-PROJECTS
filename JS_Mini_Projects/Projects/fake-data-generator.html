<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>password-generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 50px;
            height: 100vh;
        }
        .container {
            background-color: white;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;      
        }
        h1 {
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 5px;
            color: white;
            font-size: 45px;
            text-transform: uppercase;
        }
        .inp {
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            padding: 10px 20px;
        }
        .inp input {
            background-color: transparent;
            outline: none;
            border: none;
            height: 60px;
            width: 300px;
            color: aliceblue;
            font-size: 24px;
        }
        .inp p {
            color: white;
            font-family: cursive;
            text-transform: uppercase;
        }
        .box {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
        }
        button {
            width: 100%;
            border: none;
            color: #ccc;
            background-color: #222;
            height: 50px;
            cursor: pointer;
            font-family: system-ui;
            font-size: 17px;
            text-transform: capitalize;
        }
        input::placeholder {
            color: #ccc;
        }
        small {
            font-family: system-ui;
            width: 100%;
            text-align: start;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <h1>Fake Data Generator</h1>
    <div class="container">
        <div class="box">
            <small>Password Generator</small>
            <div class="inp">
                <input id="inpP" type="text" placeholder="Password Generator" readonly>
                <!-- <p>copy</p> -->
            </div>
            <button id="btnP">generate</button>
        </div>
        <div class="box">
            <small>Email Generator</small>
            <div class="inp">
                <input id="inpE" type="text" placeholder="Email Generator" readonly>
                <!-- <p>copy</p> -->
            </div>
            <button id="btnE">generate</button>
        </div>
        <div class="box">
            <small>Phone Number Generator</small>
            <div class="inp">
                <input id="inpH" type="text" placeholder="Phone Generator" readonly>
                <!-- <p>copy</p> -->
            </div>
            <button id="btnH">generate</button>
        </div>
        <div class="box">
            <small>Name Generator</small>
            <div class="inp">
                <input id="inpN" type="text" placeholder="Name Generator" readonly>
                <!-- <p>copy</p> -->
            </div>
            <button id="btnN">generate</button>
        </div>
    </div>

    <script>

        let Names = [
            ["Ahmed", "Mohammad", "Mehdi", "Adam", "Kamal"],
            ["Ali", "Omar", "Hassan", "Hussein", "Youssef"],
            ["Ibrahim", "Ismail", "Mahmoud", "Mustafa", "Hamza"],
            ["Bilal", "Tariq", "Khalid", "Walid", "Sami"],
            ["Samir", "Karim", "Nabil", "Adnan", "Ayman"],
            ["Faisal", "Farid", "Rami", "Zaid", "Ziyad"],
            ["Amir", "Anas", "Ammar", "Basim", "Bashir"],
            ["Dawood", "Elias", "Emad", "Fadi", "Fahad"],
            ["Hadi", "Hakim", "Hani", "Jamal", "Jibril"],
            ["Laith", "Majid", "Marwan", "Mazen", "Munir"],
            ["Nasser", "Nawaf", "Qasim", "Rashid", "Salim"],
            ["Salman", "Saeed", "Shadi", "Tamer", "Waleed"],
            ["Yasin", "Yahya", "Zakariya", "Zakaria", "Abbas"],
            ["Abdul", "Abdullah", "Abdulrahman", "Abdulaziz", "Abdulmalik"],
            ["Adeel", "Arif", "Asad", "Atif", "Azhar"],
            ["Badr", "Fahim", "Fawaz", "Ghassan", "Hisham"],
            ["Imran", "Irfan", "Jalal", "Jawad", "Kareem"],
            ["Luqman", "Mansoor", "Murtaza", "Noman", "Owais"],
            ["Parvez", "Rauf", "Rayan", "Sabir", "Shahzad"],
            ["Sohail", "Talha", "Usman", "Waqar", "Younis"]
        ];

        // Password
        let inpP = document.getElementById("inpP");
        let btnP = document.getElementById("btnP");

        // Email
        let inpE = document.getElementById("inpE");
        let btnE = document.getElementById("btnE");

        // Phone
        let inpH = document.getElementById("inpH");
        let btnH = document.getElementById("btnH");

        // Name
        let inpN = document.getElementById("inpN");
        let btnN = document.getElementById("btnN");

        btnP.onclick = function () {
        
            let password = "";
            for (let i = 0 ; i < 3 ; i++) {
                if (i == 0) {
                    password += Names[Math.floor(Math.random() * 19)][Math.floor(Math.random() * 5)];
                    password += ".";
                }
                if (i == 1) {
                    let Numbers = "0123456789";
                    for (let j = 0 ; j < Math.floor(Math.random() * (5 - 3 + 1) + 3) ; j++) {
                        password += Numbers[Math.floor(Math.random() * 10)];
                    }
                }
                if (i == 2) {
                    let symbols = "!@#$%^&*()";
                    for (let j = 0 ; j < Math.floor(Math.random() * (3 - 1 + 1) + 3) ; j++) {
                        password += symbols[Math.floor(Math.random() * 10)];
                    }
                }
            }
            inpP.value = password;
        }

        btnE.onclick = function () {
        
            let email = "";
            for (let i = 0 ; i < 2 ; i++) {
                if (i == 0) {
                    email += Names[Math.floor(Math.random() * 19)][Math.floor(Math.random() * 5)];
                    email += email[0] + ".";
                }
                if (i == 1) {
                    let Numbers = "0123456789";
                    for (let j = 0 ; j < Math.floor(Math.random() * (4 - 3 + 1) + 3) ; j++) {
                        email += Numbers[Math.floor(Math.random() * 10)];
                    }
                }
            }
            email += "@gmail.com";
            inpE.value = email;
        }

        btnH.onclick = function () {
            let numbers = "0123456789";
            let phone = "+212 ";
            for (let i = 0 ; i < 9 ; i++) {
                phone += numbers[Math.floor(Math.random() * 10)];
            }
            inpH.value = phone;
        }

        btnN.onclick = function () {
            inpN.value = Names[Math.floor(Math.random() * 20)][Math.floor(Math.random() * 5)];
        }

    </script>

</body>
</html>
