<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>mini pomo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 50px;
        }
        h1 {
            font-family: system-ui;
            font-size: 100px;
            text-transform: uppercase;
        }
        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 30px;
        }
        .timer {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box {
            height: 200px;
            border-radius: 60px;
            width: 200px;
            background-color: #222;
            color: aliceblue;
            font-size: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui;
            font-weight: bold;
        }
        .dp {
            font-size: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            color: #222;
        }
        button {
            background-color: #222;
            color: aliceblue;
            border: none;
            border-radius: 10px;
            font-family: system-ui;
            height: 50px;
            width: 150px;
            font-size: 23px;
            cursor: pointer;
        }
    </style>

</head>
<body>
    

    <h1>mini pomo</h1>

    <div class="container">
        <div class="timer">
            <div class="box" id="h">00</div>
            <div class="dp">:</div>
            <div class="box" id="m">00</div>
            <div class="dp">:</div>
            <div class="box" id="s">00</div>
        </div>
        <button id="btn">Start</button>
    </div>


    <script>
        let btn = document.getElementById("btn");
        let h = document.getElementById("h");
        let m = document.getElementById("m");
        let s = document.getElementById("s");
        let mod = 'Start';
        let sec;

        btn.addEventListener('click', () => {
            if (mod == 'Start') {
                btn.innerHTML = "Stop";
                mod = "Stop";
                sec = setInterval(() => {
                    if (Number(s.innerHTML) < 59) {
                        let new_time = Number(s.innerHTML) + 1;
                        if (new_time < 10) s.innerHTML = '0' + new_time;
                        else s.innerHTML = Number(s.innerHTML) + 1;
                    } else {
                        let new_time = Number(m.innerHTML) + 1;
                        if (new_time < 10) m.innerHTML = '0' + new_time;
                        else m.innerHTML = Number(m.innerHTML) + 1;
                        s.innerHTML = "00";
                    }
                    if (Number(m.innerHTML) == 59) {
                        let new_time = Number(h.innerHTML) + 1;
                        if (new_time < 10) h.innerHTML = '0' + new_time;
                        else h.innerHTML = Number(h.innerHTML) + 1;
                        m.innerHTML = "00";
                        s.innerHTML = "00";
                    }
                }, 1000);
            } else {
                btn.innerHTML = "Start";
                mod = "Start";
                h.innerHTML = "00";
                m.innerHTML = "00";
                s.innerHTML = "00";
                clearInterval(sec);
            }
        });
    </script>

</body>
</html>
