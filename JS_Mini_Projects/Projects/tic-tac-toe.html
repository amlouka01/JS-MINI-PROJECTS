<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 40px;
            height: 100vh;
        }
        h1 {
            font-family:cursive;
            text-transform: uppercase;
        }
        span {
            color: red;
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(3, 150px);
            background-color: black;
            gap: 10px;
            border: 1px solid black;
        }
        .box {
            border: 2px solid white;
            color: black;
            font-size: 100px;
            height: 150px;
            font-family: cursive;
        }
    </style>
</head>
<body>

    <h1 id="win"></h1>

    <div id="grid">
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
    </div>

    <script>
        let boxes = document.querySelectorAll(".box");
        let grid = document.getElementById("grid");
        let win = document.getElementById("win");
        let symbol = ['X', 'O'];
        let i = 0;

        function checkWinner() {
            let new_grid = [];
            for (let i = 0; i < 9; i++)
                new_grid[i] = boxes[i].textContent;
            if (new_grid[0] && new_grid[0] == new_grid[1] && new_grid[1] == new_grid[2]) return true;
            if (new_grid[3] && new_grid[3] == new_grid[4] && new_grid[4] == new_grid[5]) return true;
            if (new_grid[6] && new_grid[6] == new_grid[7] && new_grid[7] == new_grid[8]) return true;
            if (new_grid[0] && new_grid[0] == new_grid[3] && new_grid[0] == new_grid[6]) return true;
            if (new_grid[1] && new_grid[1] == new_grid[4] && new_grid[4] == new_grid[7]) return true;
            if (new_grid[2] && new_grid[2] == new_grid[5] && new_grid[5] == new_grid[8]) return true;
            if (new_grid[0] && new_grid[0] == new_grid[4] && new_grid[4] == new_grid[8]) return true;
            if (new_grid[2] && new_grid[2] == new_grid[4] && new_grid[4] == new_grid[6]) return true;
        }

        function endGame() {
            for (let i = 0; i < 9; i++) {
                if (boxes[i].textContent == "") {
                    return false;
                }
            }
            return true;
        }

        grid.addEventListener("click", (e)=> {
            if (e.target.tagName != "BUTTON" || e.target.textContent !== "") return ;
            e.target.textContent = symbol[i];
            if (checkWinner()) {
                win.innerHTML = `<span>(${symbol[i]})</span> wins!!`;
                setTimeout( () => { 
                    boxes.forEach(box => box.textContent = "") 
                    win.innerHTML = ``;
                }, 2000);
                return ;
            } else if (endGame()) {
                win.innerHTML = `<span>It's a Draw !</span>`;
                setTimeout( () => { 
                    boxes.forEach(box => box.textContent = "") 
                    win.innerHTML = ``;
                }, 2000);
                return ;
            }
            i = 1 - i;
        });
    </script>

</body>
</html>
