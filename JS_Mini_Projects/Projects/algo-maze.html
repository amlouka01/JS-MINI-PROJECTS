<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>algo maze</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #222;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 100px;
        }
        #grid {
            background-color: aliceblue;
            display: grid;
            grid-template-columns: repeat(23, 30px);
            grid-template-rows: repeat(23, 30px);
            border: 30px solid #444;
            position: relative;
            cursor: cell;
        }
        .eff1 {
            background-color: #444;
        }
        .eff0 {
            background-color: #ccc;
        }
        #start {
            height: 30px;
            width: 30px;
            border: 3px solid #ccc;
            background-color: green;
            border-radius: 50%;
            top: 0; left: 0;
            position: absolute;
            z-index: 10;
            transition: 0.3s;
        }
        #end {
            height: 30px;
            width: 30px;
            background-color: green;
            bottom: 0; right: 0;
            position: absolute;
            z-index: 10;
        }
        .btns {
            background-color: #444;
            display: grid;
            grid-template-columns: repeat(2, 100px);
            grid-template-rows: repeat(2, 100px);
            padding: 10px;
            gap: 10px;
        }
        .btns div {
            background-color: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 20px;
            color: #222;
            cursor: pointer;
            transition: 0.4s;
        }
        .btns div:hover {
            background-color: #444;
            color: #ccc;
        }
        p {
            color: rgb(250, 72, 72);
            font-family: system-ui;
            font-size: 20px;
            text-transform: uppercase;
            font-weight: 900;
            text-align: center;
            margin-bottom: 50px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <p id="msg">maze completed !</p>
        <div class="btns">
            <div id="top">top</div>
            <div id="bottom">bottom</div>
            <div id="left">left</div>
            <div id="right">right</div>
        </div>
    </div>
    <div id="grid"></div>

    <script>

        let grid = document.getElementById("grid");
        let maze = [];
        for (let i = 0 ; i < 23 ; i++) {
            let row = [];
            for (let j = 0; j < 23; j++) {
                row[j] = 1;
            }
            maze.push(row);
        }
        maze[0][0] = 0;
        let stack = [];
        stack.push([0, 0]);
        while (stack.length > 0) {
            let last = [stack[stack.length - 1][0], stack[stack.length - 1][1]];
            let neighbors = [];
            if (last[0] - 2 >= 0 && maze[last[0] - 2][last[1]] == 1)
                neighbors.push([last[0] - 2, last[1]]);
            if (last[0] + 2 <= 22 && maze[last[0] + 2][last[1]] == 1)
                neighbors.push([last[0] + 2, last[1]]);
            if (last[1] - 2 >= 0 && maze[last[0]][last[1] - 2] == 1)
                neighbors.push([last[0], last[1] - 2]);
            if (last[1] + 2 <= 22 && maze[last[0]][last[1] + 2] == 1)
                neighbors.push([last[0], last[1] + 2]);
            if (neighbors.length > 0) {
                let mid = [];
                let index = Math.floor(Math.random() * neighbors.length);
                mid.push((last[0] + neighbors[index][0]) / 2);
                mid.push((last[1] + neighbors[index][1]) / 2);
                maze[neighbors[index][0]][neighbors[index][1]] = 0;
                maze[mid[0]][mid[1]] = 0;
                stack.push(neighbors[index])
            } else {
                stack.pop();
            }
            show_maze();
        }

        function show_maze() {
            let boxs = `<div id="start"></div><div id="end"></div>`;
            for (let i = 0 ; i < 23 ; i++) {
                for (let j = 0 ; j < 23 ; j++)
                    boxs += `<div class="box eff${maze[i][j]}"></div>`;
            };
            grid.innerHTML = boxs;
        }
        show_maze();


        /////////////////////////////////////////////////////////


        let Top = document.getElementById("top");
        let Bottom = document.getElementById("bottom");
        let Left = document.getElementById("left");
        let Right = document.getElementById("right");
        let msg = document.getElementById("msg");

        let x = 0;
        let y = 0;

        function move(dir) {    
            if (dir == "top") {
                if (y - 1 < 0 || maze[y - 1][x] == 1) return ;
                y = y - 1;
            } else if (dir == "bottom") {
                if (y + 1 > 22 || maze[y + 1][x] == 1) return ;
                 y = y + 1;
            } else if (dir == "left") {
                if (x - 1 < 0 || maze[y][x - 1] == 1) return ;
                x = x - 1;
            } else if (dir == "right") {
                if (x + 1 > 22 || maze[y][x + 1] == 1) return ;
                x = x + 1;
            }
            document.getElementById('start').style.transform = `translate(${x * 30}px, ${y * 30}px)`;
            if (y == 22 && x == 22) {
                msg.style.display = "flex";
                setTimeout( () => {
                    location.reload();
                }, 2000)
            }
        }


        Top.onclick = () => move("top");
        Bottom.onclick = () => move("bottom");
        Left.onclick = () => move("left");
        Right.onclick = () => move("right");

        document.addEventListener('keydown', (e)=> {
            if (e.key === "ArrowUp") move("top");
            if (e.key === "ArrowDown") move("bottom");
            if (e.key === "ArrowLeft") move("left");
            if (e.key === "ArrowRight") move("right");
        });


    </script>
</body>
</html>
